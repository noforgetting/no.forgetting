<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NoForgetting | Tests</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="NoForgettinglogo.png">
  <link rel="apple-touch-icon" href="NoForgettinglogo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
</head>

<body class="content-page">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="NoForgettinglogo.png" alt="NoForgetting">
        <div>
          <h1>NoForgetting</h1>
        </div>
      </div>
      <nav class="nav-list"><a href="index.html" data-nav-page="index.html">Dashboard</a><a href="assignments.html"
          data-nav-page="assignments.html">Assignments</a><a href="tests.html" data-nav-page="tests.html">Tests</a><a
          href="reminders.html" data-nav-page="reminders.html">Reminders</a></nav>
    </aside>
    <main class="main-content">
      <header class="page-header">
        <div>
          <h2>Tests, quizzes, or exams</h2>
        </div>
      </header>
      <section class="panel">
        <div class="panel-header">
          <div>
            <h3>Add test reminder</h3>
          </div>
        </div>
        <form class="stacked-form" id="testForm"><label>Lesson name<input type="text" id="testLesson"
              placeholder="History"></label><label>Description <span class="optional-label">Optional</span><input
              type="text" id="testDescription" placeholder="Unit 1.1 - 1.3 Medieval History"></label><label>Test date<input
              type="date" id="testDate"></label><button type="submit">Add</button></form>
      </section>
      <section class="panel">
        <div class="panel-header">
          <div>
            <h3>All tests</h3>
          </div>
        </div>
        <div class="list" id="testList"></div>
      </section>
    </main>
  </div>
  <script type="module" src="js/tests.js"></script>
</body>

</html>
