<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>NoForgetting | Tests</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="NoForgettinglogo.png">
  <link rel="apple-touch-icon" href="NoForgettinglogo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
</head>

<body class="content-page">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="NoForgettinglogo.png" alt="NoForgetting">
        <div>
          <h1>NoForgetting</h1>
        </div>
      </div>
      <nav class="nav-list"><a href="index.html" data-nav-page="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>Dashboard</a><a href="assignments.html"
          data-nav-page="assignments.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6M9 10h6M9 14h6M9 18h4"/></svg>Assignments</a><a href="tests.html" data-nav-page="tests.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6Z"/><path d="M15 3v4h4M9 12h6M9 16h4"/></svg>Tests</a><a
          href="reminders.html" data-nav-page="reminders.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></svg>Reminders</a></nav>
    </aside>
    <main class="main-content">
      <header class="page-header">
        <div>
          <h2>Tests, quizzes, or exams</h2>
        </div>
      </header>
      <section class="panel">
        <div class="panel-header">
          <div>
            <h3>Add test reminder</h3>
          </div>
        </div>
        <form class="stacked-form" id="testForm"><label>Lesson name<input type="text" id="testLesson"
              placeholder="History"></label><label>Description <span class="optional-label">Optional</span><input
              type="text" id="testDescription" placeholder="Unit 1.1 - 1.3 Medieval History"></label><label>Test date<input
              type="date" id="testDate"></label><button type="submit">Add</button></form>
      </section>
      <section class="panel">
        <div class="panel-header">
          <div>
            <h3>All tests</h3>
          </div>
          <button type="button" class="ghost delete-done-button" id="deleteDoneTests" data-delete data-delete-bulk data-delete-title="Delete these reminders?"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M9 7l1-2h4l1 2M7 7l1 13h8l1-13"/></svg>Delete done</button>
        </div>
        <div class="list" id="testList"></div>
      </section>
    </main>
  </div>
  <script type="module" src="js/tests.js"></script>
</body>

</html>
