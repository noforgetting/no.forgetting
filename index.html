<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NoForgetting | Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="NoForgettinglogo.png">
  <link rel="apple-touch-icon" href="NoForgettinglogo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="NoForgettinglogo.png" alt="NoForgetting">
        <div>
          <h1>NoForgetting</h1>
        </div>
      </div>
      <nav class="nav-list"><a href="index.html" data-nav-page="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>Dashboard</a><a href="assignments.html"
          data-nav-page="assignments.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6M9 10h6M9 14h6M9 18h4"/></svg>Assignments</a><a href="tests.html" data-nav-page="tests.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6Z"/><path d="M15 3v4h4M9 12h6M9 16h4"/></svg>Tests</a><a
          href="reminders.html" data-nav-page="reminders.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></svg>Reminders</a></nav>
    </aside>
    <main class="main-content">
      <header class="page-header page-header--compact">
        <div>
          <p class="eyebrow" id="todayText" style="color: white;">Today</p>
        </div>
      </header>
      <section class="stats-grid" id="dashboardStats">
        <article class="stat-card"><span>Upcoming assignments</span><strong id="totalTasksStat">0</strong></article>
        <article class="stat-card"><span>Upcoming tests</span><strong id="upcomingExamsStat">0</strong></article>
        <article class="stat-card"><span>Personal reminders</span><strong id="personalRemindersStat">0</strong></article>
        <article class="stat-card"><span>Completed</span><strong id="completedTasksStat">0</strong></article>
      </section>
      <section class="dashboard-grid">
        <article class="panel">
          <div class="panel-header">
            <div>
              <h3>Upcoming assignments</h3>
            </div>
          </div>
          <div class="list" id="dashboardAssignments"></div>
        </article>
        <article class="panel">
          <div class="panel-header">
            <div>
              <h3>Upcoming tests</h3>
            </div>
          </div>
          <div class="list" id="dashboardTests"></div>
        </article>
        <article class="panel">
          <div class="panel-header">
            <div>
              <h3>Personal reminders</h3>
            </div>
          </div>
          <div class="list" id="dashboardReminders"></div>
        </article>
      </section>
    </main>
  </div>
  <script type="module" src="js/dashboard.js"></script>
</body>

</html>
